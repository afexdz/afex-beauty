<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Anbar, institut et hammam à Alger</title>
<meta name="description" content="Anbar : institut et hammam fictif, site de démonstration AFEX Beauty.">
<meta name="theme-color" content="#14302A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/marcellus.woff2" as="font" type="font/woff2" crossorigin>
<script>try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.className="static"}catch(e){}</script>
<style>
@font-face{font-family:Marcellus;src:url(assets/fonts/marcellus.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Jost;src:url(assets/fonts/jost.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Messiri;src:url(assets/fonts/messiri-ar.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:Readex;src:url(assets/fonts/readex-ar.woff2) format("woff2");font-weight:160 700;font-display:swap}
:root{--green:#14302A;--green2:#0D211D;--mist:#E4EBE5;--paper:#F4F7F3;--ink:#12201C;--mut:rgba(18,32,28,.72);--brass:#C9A867;--brass2:#E6CC92;--sage:#7E9F8E;--line:rgba(18,32,28,.16);--g:clamp(18px,4vw,56px);--hh:68px;
--disp:"Marcellus","Palatino Linotype",Georgia,serif;--body:"Jost","Helvetica Neue",Arial,sans-serif}
[lang=ar]{--disp:"Messiri","Tahoma",sans-serif;--body:"Readex","Tahoma",sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--mist);color:var(--ink);font:400 17px/1.55 var(--body);overflow-x:hidden}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.dark :focus-visible,.dk :focus-visible{outline-color:var(--brass2)}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.02;letter-spacing:.005em}
[lang=ar] h1,[lang=ar] h2,[lang=ar] h3{font-weight:700;line-height:1.2}
.btn{display:inline-flex;align-items:center;gap:.6em;min-height:46px;padding:0 24px;border-radius:99px;background:var(--green);color:var(--mist);font-weight:500;transition:background .2s,transform .2s}
.btn:hover{background:var(--green2)}
.btn:active{transform:scale(.98)}
.btn.o{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.o:hover{background:rgba(20,48,42,.07)}
.btn.br{background:var(--brass);color:var(--green2)}
.btn.br:hover{background:var(--brass2)}

#hd{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:50;display:flex;align-items:center;gap:18px;padding-inline:var(--g);transition:color .3s,background .3s;color:var(--ink)}
#hd.dark{color:var(--mist)}
#hd.solid{background:rgba(228,235,229,.88);backdrop-filter:blur(12px)}
#hd.dark.solid{background:rgba(13,33,29,.86)}
.logo{font:400 31px/1 var(--disp);text-decoration:none;letter-spacing:.08em}
#nav{display:flex;gap:26px;margin-inline:auto;font-size:14.5px}
#nav a{text-decoration:none;opacity:.82}
#nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
.sw{display:flex;gap:2px;font-size:13px}
.sw button{min-width:34px;height:34px;border-radius:99px;opacity:.7}
.sw button[aria-pressed=true]{opacity:1;box-shadow:inset 0 0 0 1.5px currentColor}
#cur{background:none;border:0;font-size:13px;height:34px;padding-inline:4px;cursor:pointer}
#cur option{color:#12201C}
#hd .btn{min-height:40px;padding:0 18px;font-size:14px}
#hd.dark .btn{background:var(--brass);color:var(--green2)}
@media(max-width:900px){#nav{display:none}#hd{gap:8px}.logo{margin-inline-end:auto}}
@media(max-width:420px){#hd .btn{padding:0 14px}.sw button{min-width:30px}}

/* hero : l'anneau */
#hero{position:relative;height:100vh;height:100svh;min-height:600px;overflow:hidden;color:var(--mist);background:radial-gradient(90% 70% at 66% 45%,#2a5246,var(--green) 55%,var(--green2))}
#hero:before{content:"";position:absolute;inset:0;background:radial-gradient(40% 30% at 70% 80%,rgba(230,204,146,.18),transparent 70%);pointer-events:none}
#hl{position:absolute;inset-inline-start:var(--g);top:calc(var(--hh) + 7vh);width:min(560px,44vw);z-index:4}
#hl h1{font-size:clamp(46px,6.2vw,96px)}
#hl p{margin-top:18px;max-width:34ch;color:rgba(228,235,229,.78);font-size:18px}
#hcap{position:absolute;inset-inline-start:var(--g);bottom:11vh;width:min(380px,36vw);z-index:4}
#hcap b{display:block;font:400 clamp(30px,3.4vw,48px)/1.05 var(--disp);color:var(--brass2)}
#hcap span{display:block;margin:10px 0 18px;color:rgba(228,235,229,.8);font-size:16px;max-width:32ch}
#hdots{position:absolute;inset-inline-end:var(--g);top:50%;transform:translateY(-50%);display:grid;gap:11px;z-index:5}
#hdots i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--brass2);transition:background .3s,transform .3s}
#hdots i.on{background:var(--brass2);transform:scale(1.35)}
#stage{position:absolute;inset-block:var(--hh) 0;inset-inline-end:0;width:64%;display:grid;place-items:center;perspective:1700px;perspective-origin:50% 38%}
#ring{--pw:min(23vw,330px);--R:calc(var(--pw) * 1.02);position:relative;width:var(--pw);height:calc(var(--pw) * 1.5);transform-style:preserve-3d;will-change:transform;margin-top:4vh}
.fc{position:absolute;inset:0;transform:rotateY(calc(var(--i) * 60deg)) translateZ(var(--R));border-radius:999px 999px 16px 16px;overflow:hidden;background:#0d211d;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);backface-visibility:hidden}
.fc img{width:100%;height:100%;object-fit:cover}
.fc:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.5px rgba(230,204,146,.35);border-radius:inherit;pointer-events:none}
#hsc{position:absolute;inset-inline:0;bottom:14px;text-align:center;font-size:12px;opacity:.6;z-index:4}
@media(max-width:860px){
  #hl{inset-inline:var(--g);width:auto;top:calc(var(--hh) + 2vh)}
  #hl h1{font-size:clamp(40px,12vw,60px)}
  #hl p{margin-top:10px;font-size:16px}
  #stage{inset:auto 0 0;width:100%;height:52svh;place-items:center}
  #ring{--pw:min(46vw,34svh);margin-top:0;margin-bottom:12svh}
  #hcap{inset-inline:var(--g);bottom:18px;width:auto;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;background:rgba(13,33,29,.78);backdrop-filter:blur(6px);padding:12px 16px;border-radius:14px}
  #hcap b{font-size:24px;grid-column:1}
  #hcap span{margin:0;font-size:13.5px;grid-column:1}
  #hcap .btn{grid-column:2;grid-row:1/3;min-height:42px;padding:0 16px}
  #hdots,#hsc{display:none}
}

/* rituel */
.sec{padding:clamp(80px,11vw,140px) var(--g)}
.sh h2{font-size:clamp(40px,6vw,88px)}
.sh p{margin-top:14px;max-width:48ch;font-size:18px;color:var(--mut)}
.rg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,6vw,100px);margin-top:clamp(30px,5vw,60px);align-items:start}
#rpic{position:sticky;top:calc(var(--hh) + 20px);aspect-ratio:4/5;max-height:calc(100svh - var(--hh) - 50px);border-radius:999px 999px 20px 20px;overflow:hidden;background:#cfd9d1;justify-self:start;width:100%;max-width:480px}
#rpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .7s,transform 1.2s}
#rpic img.on{opacity:1;transform:none}
.rs{min-height:62vh;display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--line);padding:30px 0;opacity:.35;transition:opacity .5s}
.rs.on{opacity:1}
.rs i{font:400 22px var(--disp);font-style:normal;color:var(--sage)}
.rs h3{font-size:clamp(34px,4.4vw,64px);margin:8px 0 12px}
.rs p{max-width:40ch;font-size:19px;color:var(--mut)}
@media(max-width:860px){.rg{grid-template-columns:1fr}#rpic{position:relative;top:0;aspect-ratio:16/11;max-width:none;border-radius:999px 999px 16px 16px/60% 60% 16px 16px;margin-bottom:10px}.rs{min-height:0;opacity:1;padding:22px 0}}

/* carte */
#carte{background:var(--paper)}
.cg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(30px,6vw,96px);margin-top:clamp(34px,5vw,70px);align-items:start}
#cpic{position:sticky;top:calc(var(--hh) + 24px);aspect-ratio:4/5;max-height:calc(100svh - var(--hh) - 60px);border-radius:999px 999px 20px 20px;overflow:hidden;background:#cfd9d1;justify-self:start;width:100%;max-width:440px}
#cpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#cpic img.on{opacity:1}
#tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#tabs button{min-height:42px;padding:0 20px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:500}
#tabs button[aria-selected=true]{background:var(--green);color:var(--mist);box-shadow:none}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.row h3{font-size:clamp(23px,2.3vw,31px)}
.row p{grid-column:1;font-size:15.5px;color:var(--mut);max-width:46ch}
.row .pr{grid-row:1;grid-column:2;text-align:end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .pr small{display:block;font-weight:400;font-size:12.5px;opacity:.65}
.row .ad{grid-column:2;grid-row:2;justify-self:end;min-height:38px;padding:0 16px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--green);color:var(--green);font-size:14px;font-weight:500}
.row .ad[aria-pressed=true]{background:var(--green);color:var(--mist)}
#sbar{position:fixed;inset-inline:var(--g);bottom:16px;z-index:40;display:flex;align-items:center;gap:16px;max-width:620px;margin-inline:auto;padding:10px 10px 10px 24px;border-radius:99px;background:var(--green2);color:var(--mist);box-shadow:0 18px 40px -12px rgba(0,0,0,.5);transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#sbar.on{transform:none}
#sbar div{flex:1;min-width:0;line-height:1.25;font-size:14px}
#sbar b{display:block;font-size:16px}
#sbar .btn{min-height:44px}
@media(max-width:860px){.cg{grid-template-columns:1fr}#cpic{position:relative;top:0;aspect-ratio:16/11;max-width:none;border-radius:999px 999px 16px 16px/60% 60% 16px 16px}}

/* carte cadeau */
#gift{background:var(--green);color:var(--mist)}
#gift .sh p{color:rgba(228,235,229,.78)}
.gg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,90px);margin-top:clamp(30px,5vw,60px);align-items:center}
#card{perspective:1000px}
#cd{position:relative;aspect-ratio:1.6;max-width:520px;border-radius:22px;padding:28px;background:linear-gradient(135deg,#d9bd80,#b99252 45%,#e8d3a0 70%,#b08a4a);color:#2a2010;box-shadow:0 40px 80px -30px #000;transition:transform .25s;will-change:transform;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#cd:before{content:"";position:absolute;inset-inline-end:-50px;top:-60px;width:230px;height:230px;border-radius:50%;border:2px solid rgba(42,32,16,.25);box-shadow:0 0 0 22px rgba(42,32,16,.08)}
#cd .k{font:400 28px var(--disp);letter-spacing:.12em}
#cd .a{font:400 clamp(40px,6vw,64px)/1 var(--disp)}
#cd .t{font-size:15px;max-width:30ch;line-height:1.4}
#cd .t b{display:block;font:400 22px var(--disp);margin-bottom:2px}
#cd .v{font-size:12.5px;opacity:.75}
.gf{display:grid;gap:14px}
.gf h4{font:400 20px var(--disp)}
.gf .ch{display:flex;flex-wrap:wrap;gap:8px}
.gf .ch button{min-height:42px;padding:0 18px;border-radius:99px;box-shadow:inset 0 0 0 1.5px rgba(228,235,229,.35)}
.gf .ch button[aria-pressed=true]{background:var(--brass);color:var(--green2);box-shadow:none}
.gf input,.gf textarea{width:100%;min-height:48px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.08);border:1.5px solid rgba(228,235,229,.3);color:var(--mist)}
.gf textarea{min-height:84px;resize:vertical}
.gf ::placeholder{color:rgba(228,235,229,.5)}
.gf small{color:rgba(228,235,229,.7)}
@media(max-width:860px){.gg{grid-template-columns:1fr}}

/* équipe */
.tm{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,44px);margin-top:clamp(30px,5vw,60px)}
.tc{padding:30px 26px 26px;border-radius:22px;background:var(--paper);box-shadow:0 1px 0 var(--line)}
.mono{display:grid;place-items:center;width:112px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--brass2),var(--brass) 60%,#8c6e36);font:400 54px/1 var(--disp);color:var(--green2)}
.tc h3{margin-top:22px;font-size:34px}
.tc .r{margin-top:4px;font-weight:600;font-size:14.5px;color:var(--green)}
.tc p{margin:12px 0 20px;font-size:15.5px;color:var(--mut)}
@media(max-width:860px){.tm{grid-template-columns:1fr}.tc{display:grid;grid-template-columns:84px 1fr;gap:6px 18px;padding:20px}.mono{width:84px;font-size:40px;grid-row:1/span 5}.tc h3{margin-top:0}.tc p{margin:6px 0 12px}.tc .btn{grid-column:2;justify-self:start}}

/* suivi */
#suivi{background:var(--green2);color:var(--mist)}
#suivi .sh p{color:rgba(228,235,229,.78)}
#sf{display:flex;gap:10px;margin-top:30px;max-width:560px}
#sf input{flex:1;min-width:0;height:52px;padding:0 20px;border-radius:99px;background:rgba(255,255,255,.08);border:1.5px solid rgba(228,235,229,.3);color:var(--mist);letter-spacing:.04em}
#sf input::placeholder{color:rgba(228,235,229,.55)}
#st{margin-top:34px;max-width:640px;min-height:20px}
.stp{display:grid;grid-template-columns:34px 1fr;gap:0 16px;position:relative;padding-bottom:26px}
.stp:before{content:"";position:absolute;inset-inline-start:16px;top:30px;bottom:-4px;width:2px;background:rgba(228,235,229,.25)}
.stp:last-child:before{display:none}
.stp i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(228,235,229,.4);font-style:normal;font-size:14px}
.stp.ok i{background:var(--brass);color:var(--green2);box-shadow:none}
.stp.ok:before{background:var(--brass)}
.stp b{font-weight:500;font-size:18px;align-self:center}
.stm{margin-bottom:22px;font-size:15px}
.stm b{font:400 30px var(--disp);display:block;margin-bottom:2px;color:var(--brass2)}

#faq{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(30px,6vw,90px);background:var(--paper)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:22px 0;font:400 clamp(21px,2.1vw,28px)/1.2 var(--disp)}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font:300 30px/1 var(--body);transition:transform .25s}
details[open] summary:after{transform:rotate(45deg)}
details p{padding:0 0 24px;max-width:56ch;color:var(--mut)}
@media(max-width:860px){#faq{grid-template-columns:1fr}}

footer{background:var(--green2);color:var(--mist);padding:clamp(70px,9vw,120px) var(--g) 28px;overflow:hidden;border-top:1px solid rgba(228,235,229,.12)}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px;align-items:end}
.fg h2{font-size:clamp(38px,5vw,72px)}
.fg p{font-size:15px;opacity:.78}
#big{margin-top:clamp(40px,7vw,90px);padding-bottom:.1em;font:400 clamp(110px,28vw,460px)/.95 var(--disp);color:transparent;-webkit-text-stroke:1.5px rgba(230,204,146,.3);text-align:center;white-space:nowrap;user-select:none;letter-spacing:.06em}
.dm{margin-top:20px;font-size:12.5px;opacity:.55;text-align:center}
@media(max-width:860px){.fg{grid-template-columns:1fr}}

.wa-f{position:fixed;inset-inline-end:16px;bottom:16px;z-index:45;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);transition:transform .35s}
.wa-f svg{width:30px;height:30px;fill:#fff}
body.sb .wa-f{transform:translateY(-70px)}

dialog{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:24px;max-width:min(94vw,860px);width:100%;max-height:92svh;overflow:auto;box-shadow:0 40px 100px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(13,33,29,.7);backdrop-filter:blur(3px)}
.dh{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;background:var(--paper);border-bottom:1px solid var(--line)}
.dh h2{font-size:28px}
.dh button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line)}
.ico{width:1.1em;height:1.1em}
.db{display:grid;grid-template-columns:minmax(0,1fr) 280px}
.df{padding:8px 26px 30px;min-width:0}
.df h4{margin:26px 0 12px;font:400 21px/1 var(--disp)}
.sg{display:grid;gap:6px}
.sg h5{margin:12px 0 2px;font-size:13px;color:var(--green);font-weight:600}
.ck{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-size:15px}
.ck:has(input:checked){background:rgba(126,159,142,.25);box-shadow:inset 0 0 0 1.5px var(--green)}
.ck input{accent-color:var(--green);width:18px;height:18px}
.ck span{flex:1}.ck em{font-style:normal;font-size:13px;opacity:.7;white-space:nowrap}
.ch2{display:flex;flex-wrap:wrap;gap:8px}
.ch2 button{min-height:40px;padding:0 16px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14.5px}
.ch2 button[aria-pressed=true]{background:var(--green);color:var(--mist);box-shadow:none}
.ch2 button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.days button{flex:0 0 auto;min-width:74px;padding:10px 8px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;line-height:1.2;font-size:13px}
.days button b{display:block;font:400 22px var(--disp)}
.days button[aria-pressed=true]{background:var(--green);color:var(--mist);box-shadow:none}
.days button:disabled{opacity:.4}
.fl{display:grid;gap:10px}
.fl input,.fl select,.fl textarea{width:100%;min-height:48px;padding:10px 16px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}
.fl textarea{resize:vertical;min-height:76px}
.ph{display:grid;grid-template-columns:124px 1fr;gap:10px}
.sm{padding:26px;background:var(--mist);border-inline-start:1px solid var(--line);position:sticky;top:77px;align-self:start}
.sm h4{font:400 22px var(--disp);margin-bottom:12px}
.sm ul{list-style:none;padding:0;font-size:14.5px;display:grid;gap:8px}
.sm li{display:flex;justify-content:space-between;gap:10px}
.sm li span:last-child{white-space:nowrap}
.sm .tt{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.sm .tt b{font:400 28px var(--disp)}
.sm .btn{width:100%;justify-content:center;margin-top:16px}
.sm small{display:block;margin-top:10px;font-size:12.5px;opacity:.7}
#er{color:#A12B44;font-size:14px;min-height:20px;margin-top:8px;font-weight:500}
#ok{padding:50px 26px 40px;text-align:center}
#ok h3{font-size:40px}
#ok .cd2{display:inline-block;margin:18px 0;padding:12px 26px;border-radius:99px;background:var(--mist);font:400 28px var(--disp);letter-spacing:.06em;direction:ltr}
#ok .btn{margin:6px}
#ok .btn.o{color:var(--ink)}
@media(max-width:760px){.db{grid-template-columns:1fr}.sm{position:static;border-inline-start:0;border-top:1px solid var(--line);order:2}.df,.dh{padding-inline:18px}}
</style>
</head>
<body>
