<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nacre, coiffure et ongles à Oran</title>
<meta name="description" content="Nacre : salon de coiffure et d'ongles fictif, site de démonstration AFEX Beauty.">
<meta name="theme-color" content="#F1E9E5">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/bodoni.woff2" as="font" type="font/woff2" crossorigin>
<script>try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.className="static"}catch(e){}</script>
<style>
@font-face{font-family:Bodoni;src:url(assets/fonts/bodoni.woff2) format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:Bodoni;src:url(assets/fonts/bodoni-i.woff2) format("woff2");font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:Hanken;src:url(assets/fonts/hanken.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Messiri;src:url(assets/fonts/messiri-ar.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:Readex;src:url(assets/fonts/readex-ar.woff2) format("woff2");font-weight:160 700;font-display:swap}
:root{--pearl:#F1E9E5;--paper:#FBF8F5;--ink:#20141A;--wine:#5A1D37;--wine2:#3B1124;--rose:#DDAAB6;--mauve:#9A6B84;--line:rgba(32,20,26,.15);--g:clamp(18px,4vw,56px);--hh:68px;
--disp:"Bodoni","Didot","Times New Roman",serif;--body:"Hanken","Helvetica Neue",Arial,sans-serif}
[lang=ar]{--disp:"Messiri","Tahoma",sans-serif;--body:"Readex","Tahoma",sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--pearl);color:var(--ink);font:400 16px/1.55 var(--body);overflow-x:hidden}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
.dark :focus-visible,.dk :focus-visible{outline-color:var(--rose)}
.ico{width:1.1em;height:1.1em;vertical-align:-.15em}
.btn{display:inline-flex;align-items:center;gap:.6em;min-height:46px;padding:0 24px;border-radius:99px;background:var(--wine);color:var(--pearl);font-weight:500;letter-spacing:.01em;transition:background .2s,transform .2s}
.btn:hover{background:var(--wine2)}
.btn:active{transform:scale(.98)}
.btn.o{background:none;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.o:hover{background:rgba(90,29,55,.08)}
.btn.rose{background:var(--rose);color:var(--wine2)}
.btn.rose:hover{background:#e8bcc6}

/* en-tête */
#hd{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:50;display:flex;align-items:center;gap:18px;padding-inline:var(--g);color:var(--ink);transition:color .3s,background .3s}
#hd.dark{color:var(--pearl)}
#hd.solid{background:rgba(241,233,229,.86);backdrop-filter:blur(12px)}
#hd.dark.solid{background:rgba(59,17,36,.82)}
.logo{font:italic 600 30px/1 var(--disp);text-decoration:none;letter-spacing:.01em}
[lang=ar] .logo{font-style:normal;font-weight:700}
#nav{display:flex;gap:26px;margin-inline:auto;font-size:14.5px}
#nav a{text-decoration:none;opacity:.8}
#nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
.sw{display:flex;gap:2px;font-size:13px}
.sw button{min-width:34px;height:34px;border-radius:99px;opacity:.7}
.sw button[aria-pressed=true]{opacity:1;box-shadow:inset 0 0 0 1.5px currentColor}
#hd .btn{min-height:40px;padding:0 18px;font-size:14px}
#hd.dark .btn{background:var(--rose);color:var(--wine2)}
#cur{background:none;border:0;font-size:13px;height:34px;padding-inline:4px;cursor:pointer}
#cur option{color:#20141A}
@media(max-width:900px){#nav{display:none}#hd{gap:8px}.logo{margin-inline-end:auto}}
@media(max-width:420px){#hd .btn{padding:0 14px}.sw button{min-width:30px}}

/* hero : le miroir */
#hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#f8f1ee,var(--pearl) 60%,#e6d9d4)}
#hword{position:absolute;inset-inline:0;top:50%;transform:translateY(-54%);text-align:center;font:italic 500 min(36vw,58vh)/.8 var(--disp);color:var(--rose);opacity:.5;letter-spacing:-.03em;white-space:nowrap;pointer-events:none;user-select:none}
[lang=ar] #hword{font-style:normal;font-size:min(34vw,50vh);font-weight:700}
#stage{position:absolute;inset:var(--hh) 0 0;display:grid;place-items:center;perspective:1400px}
#mir{--mw:min(36vw,48vh);width:var(--mw);aspect-ratio:3/4.3;transform-style:preserve-3d;will-change:transform}
.frame{position:absolute;inset:0;padding:11px;border-radius:999px 999px 26px 26px;background:linear-gradient(145deg,#f7e8e0 0%,#d9a8b4 38%,#fbefe7 52%,#b98a9c 78%,#f2dcd3);box-shadow:0 40px 80px -30px rgba(90,29,55,.55),0 0 0 1px rgba(90,29,55,.12)}
.glass{position:relative;width:100%;height:100%;overflow:hidden;border-radius:999px 999px 18px 18px;background:#d6c6c2}
.look{position:absolute;inset:0}
.look img{width:100%;height:100%;object-fit:cover}
.glass:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 32%,transparent 70%,rgba(255,255,255,.14));pointer-events:none}
#hcap{position:absolute;inset-inline-start:var(--g);bottom:11vh;max-width:min(330px,28vw);z-index:5}
#hcap b{display:block;font:500 clamp(34px,4.6vw,66px)/.95 var(--disp)}
#hcap span{display:block;margin:12px 0 18px;max-width:30ch;font-size:15.5px;color:rgba(32,20,26,.78)}
#hdots{position:absolute;inset-inline-end:var(--g);top:50%;transform:translateY(-50%);display:grid;gap:12px;z-index:5}
#hdots i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--wine);transition:background .3s,transform .3s}
#hdots i.on{background:var(--wine);transform:scale(1.3)}
#hsub{position:absolute;inset-inline-end:var(--g);bottom:11vh;text-align:end;max-width:22ch;font-size:14px;color:rgba(32,20,26,.7)}
#hsc{position:absolute;inset-inline:0;bottom:18px;text-align:center;font-size:12px;opacity:.6}
@media(max-width:820px){
  #mir{--mw:min(62vw,44vh)}
  #stage{inset:calc(var(--hh) - 6px) 0 auto;height:56svh}
  #hcap{inset-inline:var(--g);bottom:5vh;max-width:none}
  #hcap b{font-size:clamp(34px,11vw,52px)}
  #hcap span{margin:8px 0 14px}
  #hsub,#hdots,#hsc{display:none}
  #hword{top:34%;font-size:min(58vw,34vh)}
}

/* manifeste */
.man{padding:clamp(80px,14vw,170px) var(--g);display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(30px,6vw,100px);align-items:end}
.man h2{font:500 clamp(34px,5.4vw,82px)/1.02 var(--disp);letter-spacing:-.01em;text-wrap:balance}
.man p{max-width:42ch;font-size:18px;color:rgba(32,20,26,.8)}
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:clamp(30px,5vw,70px);border-top:1px solid var(--line)}
.facts div{padding:22px 20px 0 0}
.facts b{display:block;font:500 clamp(22px,2.4vw,32px)/1.1 var(--disp)}
.facts span{display:block;margin-top:6px;font-size:14.5px;color:rgba(32,20,26,.7)}
@media(max-width:820px){.man{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.facts div{padding:16px 0;border-bottom:1px solid var(--line)}}

/* la carte */
#carte{background:var(--paper);padding:clamp(70px,10vw,130px) var(--g) clamp(120px,14vw,180px)}
.sh h2{font:500 clamp(40px,6.4vw,96px)/.95 var(--disp);letter-spacing:-.015em}
.sh p{margin-top:14px;font-size:17px;color:rgba(32,20,26,.75);max-width:44ch}
.cg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(30px,6vw,96px);margin-top:clamp(34px,5vw,70px);align-items:start}
#cpic{position:sticky;top:calc(var(--hh) + 24px);aspect-ratio:4/5;max-height:calc(100svh - var(--hh) - 60px);border-radius:999px 999px 20px 20px;overflow:hidden;perspective:900px;background:#d9cbc7;justify-self:start;width:100%;max-width:440px}
#cpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#cpic img.on{opacity:1}
#tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#tabs button{min-height:42px;padding:0 20px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:500;transition:background .2s,color .2s}
#tabs button[aria-selected=true]{background:var(--wine);color:var(--pearl);box-shadow:none}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.row h3{font:500 clamp(22px,2.3vw,30px)/1.1 var(--disp)}
.row p{grid-column:1;font-size:15px;color:rgba(32,20,26,.72);max-width:46ch}
.row .pr{grid-row:1;grid-column:2;text-align:end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .pr small{display:block;font-weight:400;font-size:12.5px;opacity:.65}
.row .ad{grid-column:2;grid-row:2;justify-self:end;min-height:38px;padding:0 16px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--wine);color:var(--wine);font-size:14px;font-weight:500;transition:.2s}
.row .ad[aria-pressed=true]{background:var(--wine);color:var(--pearl)}
#sbar{position:fixed;inset-inline:var(--g);bottom:16px;z-index:40;display:flex;align-items:center;gap:16px;max-width:620px;margin-inline:auto;padding:10px 10px 10px 24px;border-radius:99px;background:var(--wine2);color:var(--pearl);box-shadow:0 18px 40px -12px rgba(32,20,26,.5);transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#sbar.on{transform:none}
#sbar div{flex:1;min-width:0;line-height:1.25;font-size:14px}
#sbar b{display:block;font-size:16px}
#sbar .btn{min-height:44px}
@media(max-width:820px){.cg{grid-template-columns:1fr}#cpic{position:relative;top:0;aspect-ratio:16/11;max-width:none;border-radius:999px 999px 16px 16px/60% 60% 16px 16px}.row{grid-template-columns:1fr auto}}

/* le salon : défilement horizontal */
#salon{position:relative;height:100vh;height:100svh;overflow:hidden;background:var(--wine2);color:var(--pearl)}
#trk{display:flex;align-items:center;gap:clamp(18px,3vw,44px);height:100%;padding-inline:var(--g);width:max-content;padding-top:var(--hh)}
#salon .sh{flex:0 0 min(78vw,520px)}
#salon .sh p{color:rgba(241,233,229,.72)}
.pn{flex:0 0 auto;height:min(68svh,640px);position:relative;margin:0}
.pn img{height:100%;width:auto;border-radius:20px;object-fit:cover;aspect-ratio:var(--ar)}
.pn:nth-of-type(odd) img{border-radius:999px 999px 20px 20px}
.pn figcaption{position:absolute;inset-inline:0;bottom:-34px;font-size:14px;opacity:.78}
@media(max-width:820px){.pn{height:58svh}}
html.static #salon{height:auto;padding:80px 0}html.static #trk{overflow-x:auto;padding-top:20px}

/* équipe */
#equipe{padding:clamp(80px,12vw,150px) var(--g)}
.tm{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,44px);margin-top:clamp(30px,5vw,60px)}
.tc{perspective:800px}
.tc .in{padding:30px 26px 26px;border-radius:26px;background:var(--paper);box-shadow:0 1px 0 var(--line),0 30px 50px -36px rgba(90,29,55,.45);transition:transform .3s;will-change:transform}
.mono{display:grid;place-items:center;width:140px;aspect-ratio:3/4;border-radius:999px 999px 14px 14px;background:linear-gradient(160deg,var(--rose),#f3ddd6 60%,var(--mauve));font:italic 500 78px/1 var(--disp);color:var(--wine2)}
[lang=ar] .mono{font-style:normal;font-size:60px}
.tc h3{margin-top:22px;font:500 34px/1 var(--disp)}
.tc .r{margin-top:4px;font-weight:600;font-size:14.5px;color:var(--wine)}
.tc p{margin:12px 0 20px;font-size:15.5px;color:rgba(32,20,26,.78)}
@media(max-width:820px){.tm{grid-template-columns:1fr}.tc .in{display:grid;grid-template-columns:100px 1fr;gap:6px 18px;padding:20px}.mono{width:100px;font-size:56px;grid-row:1/span 5}.tc .btn{grid-column:2;justify-self:start}.tc h3{margin-top:0}.tc p{margin:6px 0 12px}}

/* suivi */
#suivi{background:var(--wine);color:var(--pearl);padding:clamp(80px,11vw,140px) var(--g)}
#suivi .sh p{color:rgba(241,233,229,.78)}
#sf{display:flex;gap:10px;margin-top:30px;max-width:560px}
#sf input{flex:1;min-width:0;height:52px;padding:0 20px;border-radius:99px;background:rgba(255,255,255,.1);border:1.5px solid rgba(241,233,229,.3);color:var(--pearl);letter-spacing:.04em}
#sf input::placeholder{color:rgba(241,233,229,.55)}
#st{margin-top:34px;max-width:640px;min-height:20px}
.stp{display:grid;grid-template-columns:34px 1fr;gap:0 16px;position:relative;padding-bottom:26px}
.stp:before{content:"";position:absolute;inset-inline-start:16px;top:30px;bottom:-4px;width:2px;background:rgba(241,233,229,.25)}
.stp:last-child:before{display:none}
.stp i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(241,233,229,.4);font-style:normal;font-size:14px}
.stp.ok i{background:var(--rose);color:var(--wine2);box-shadow:none}
.stp.ok:before{background:var(--rose)}
.stp b{font-weight:500;font-size:18px;align-self:center}
.stp span{grid-column:2;font-size:14px;opacity:.75}
.stm{margin-bottom:22px;font-size:15px;opacity:.9}
.stm b{font:italic 500 28px var(--disp);display:block;margin-bottom:2px}

/* questions */
#faq{padding:clamp(80px,11vw,140px) var(--g);display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(30px,6vw,90px);background:var(--paper)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:22px 0;font:500 clamp(20px,2vw,26px)/1.2 var(--disp)}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font:300 30px/1 var(--body);transition:transform .25s}
details[open] summary:after{transform:rotate(45deg)}
details p{padding:0 0 24px;max-width:56ch;color:rgba(32,20,26,.8)}
@media(max-width:820px){#faq{grid-template-columns:1fr}}

/* pied */
footer{background:var(--ink);color:var(--pearl);padding:clamp(70px,9vw,120px) var(--g) 28px;overflow:hidden}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px;align-items:end}
.fg h2{font:italic 500 clamp(36px,5vw,72px)/1 var(--disp)}
[lang=ar] .fg h2{font-style:normal}
.fg p{font-size:15px;opacity:.78}
#big{margin-top:clamp(40px,7vw,90px);font:italic 500 clamp(120px,32vw,520px)/.78 var(--disp);color:transparent;-webkit-text-stroke:1.5px rgba(241,233,229,.28);text-align:center;white-space:nowrap;letter-spacing:-.03em;user-select:none}
[lang=ar] #big{font-style:normal}
.dm{margin-top:20px;font-size:12.5px;opacity:.55;text-align:center}
@media(max-width:820px){.fg{grid-template-columns:1fr}}

/* WhatsApp */
.wa-f{position:fixed;inset-inline-end:16px;bottom:16px;z-index:45;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);transition:transform .35s}
.wa-f svg{width:30px;height:30px;fill:#fff}
body.sb .wa-f{transform:translateY(-70px)}

/* réservation */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:26px;max-width:min(94vw,860px);width:100%;max-height:92svh;overflow:auto;box-shadow:0 40px 100px -20px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(32,20,26,.62);backdrop-filter:blur(3px)}
.dh{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;background:var(--paper);border-bottom:1px solid var(--line)}
.dh h2{font:500 28px/1 var(--disp)}
.dh button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line)}
.db{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:0}
.df{padding:8px 26px 30px;min-width:0}
.df h4{margin:26px 0 12px;font:500 20px/1 var(--disp)}
.sg{display:grid;gap:6px}
.sg h5{margin:12px 0 2px;font-size:13px;color:var(--wine);font-weight:600}
.ck{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-size:15px}
.ck:has(input:checked){background:rgba(221,170,182,.3);box-shadow:inset 0 0 0 1.5px var(--wine)}
.ck input{accent-color:var(--wine);width:18px;height:18px}
.ck span{flex:1}.ck em{font-style:normal;font-size:13px;opacity:.7;white-space:nowrap}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch button{min-height:40px;padding:0 16px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14.5px}
.ch button[aria-pressed=true]{background:var(--wine);color:var(--pearl);box-shadow:none}
.ch button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.days button{flex:0 0 auto;min-width:74px;padding:10px 8px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;line-height:1.2;font-size:13px}
.days button b{display:block;font:500 22px var(--disp)}
.days button[aria-pressed=true]{background:var(--wine);color:var(--pearl);box-shadow:none}
.days button:disabled{opacity:.4}
.fl{display:grid;gap:10px}
.fl input,.fl select,.fl textarea{width:100%;min-height:48px;padding:10px 16px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}
.fl textarea{resize:vertical;min-height:76px}
.ph{display:grid;grid-template-columns:124px 1fr;gap:10px}
.sm{padding:26px;background:var(--pearl);border-inline-start:1px solid var(--line);position:sticky;top:77px;align-self:start}
.sm h4{font:500 22px var(--disp);margin-bottom:12px}
.sm ul{list-style:none;padding:0;font-size:14.5px;display:grid;gap:8px}
.sm li{display:flex;justify-content:space-between;gap:10px}
.sm li span:last-child{white-space:nowrap}
.sm .tt{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.sm .tt b{font:500 28px var(--disp)}
.sm .btn{width:100%;justify-content:center;margin-top:16px}
.sm small{display:block;margin-top:10px;font-size:12.5px;opacity:.7}
#er{color:#A12B44;font-size:14px;min-height:20px;margin-top:8px;font-weight:500}
#ok{padding:50px 26px 40px;text-align:center}
#ok h3{font:500 40px/1 var(--disp)}
#ok .cd{display:inline-block;margin:18px 0;padding:12px 26px;border-radius:99px;background:var(--pearl);font:500 28px var(--disp);letter-spacing:.06em;direction:ltr}
#ok .btn{margin:6px}
@media(max-width:760px){.db{grid-template-columns:1fr}.sm{position:static;border-inline-start:0;border-top:1px solid var(--line);order:2}.df{padding-inline:18px}.dh{padding-inline:18px}}
[dir=rtl] .rt{transform:scaleX(-1)}
html.static *{scroll-behavior:auto}
</style>
</head>
<body>
<header id="hd">
  <a class="logo" href="#hero" aria-label="Nacre">Nacre</a>
  <nav id="nav" aria-label="Navigation"><a href="#carte"></a><a href="#salon"></a><a href="#equipe"></a><a href="#suivi"></a><a href="#faq"></a></nav>
  <div class="sw" role="group" aria-label="Langue"><button type="button" data-l="fr" aria-pressed="true">FR</button><button type="button" data-l="en" aria-pressed="false">EN</button><button type="button" data-l="ar" aria-pressed="false">ع</button></div>
  <select id="cur" aria-label="Devise"><option value="DZD">DA</option><option value="EUR">€</option><option value="USD">$</option></select>
  <button class="btn" id="hbook" type="button" data-t="bookShort"></button>
</header>

<main>
<section id="hero" aria-label="Nacre">
  <div id="hword" aria-hidden="true"></div>
  <div id="stage">
